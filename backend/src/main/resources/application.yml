spring:
  application:
    name: flaw-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/flaw}
    username: ${DB_USER:flaw}
    password: ${DB_PASSWORD:flaw_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

flaw:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}}
  osv:
    base-url: ${OSV_BASE_URL:https://api.osv.dev}
